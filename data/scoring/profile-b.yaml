# 评分细则 B：技术优先型（价格 30 / 技术 50 / 商务 20）
#
# 存在的意义：**演示「换一套细则，分数跟着变」**（手册 §4.5）。
# 同一份投标文件用 A/B 两套细则评，技术分权重不同，总分与排名会变——这是评审最认的"口径可配置"证据。

id: profile-b
name: 技术优先型（价格 30 / 技术 50 / 商务 20）
version: "2026-11-15"
total: 100
scoring_method: 综合评分法（技术优先）

requirements:
  max_price: 2000000
  duration_days: 90
  price_unit: 元

items:
  # ---------------------------------------------------------------- 价格（30）
  - id: P1
    category: 价格
    name: 投标报价
    type: price_ratio
    weight: 30
    tiers:
      - { max_ratio: 0.90, score: 30, reason: 报价低于最高限价的 90% }
      - { max_ratio: 0.97, score: 27, reason: 报价处于合理区间（90%–97%） }
      - { max_ratio: 1.00, score: 21, reason: 报价贴近最高限价（97%–100%） }
      - { max_ratio: 99.00, score: 0, reason: 报价超过最高限价，按废标处理 }
    basis: 招标文件评分办法：价格分权重 30%
    basis_status: pending

  # ---------------------------------------------------------------- 技术（50）
  - id: T1
    category: 技术
    name: 技术方案完整性
    type: presence
    weight: 12
    patterns: ["技术方案", "技术路线"]
    tiers:
      - { state: provided, score: 12, reason: 提供了技术方案/技术路线章节 }
      - { state: missing, score: 0, reason: 未见技术方案章节 }
    basis: 招标文件评分办法：技术方案完整性（权重上调）
    basis_status: pending

  - id: T2
    category: 技术
    name: 实施方案与进度计划
    type: presence
    weight: 12
    patterns: ["实施方案", "实施计划", "进度计划"]
    tiers:
      - { state: provided, score: 12, reason: 提供了实施方案/进度计划 }
      - { state: missing, score: 0, reason: 未见实施方案或进度计划 }
    basis: 招标文件评分办法：实施方案与进度计划
    basis_status: pending

  - id: T3
    category: 技术
    name: 质量保证措施
    type: presence
    weight: 10
    patterns: ["质量保证", "质量管理", "质量控制"]
    tiers:
      - { state: provided, score: 10, reason: 提供了质量保证措施 }
      - { state: missing, score: 0, reason: 未见质量保证措施 }
    basis: 招标文件评分办法：质量保证措施
    basis_status: pending

  - id: T4
    category: 技术
    name: 应急与安全保障
    type: presence
    weight: 8
    patterns: ["应急预案", "安全保障", "安全措施", "应急保障"]
    tiers:
      - { state: provided, score: 8, reason: 提供了应急/安全保障措施 }
      - { state: missing, score: 0, reason: 未见应急或安全保障措施 }
    basis: 招标文件评分办法：应急与安全保障
    basis_status: pending

  - id: T5
    category: 技术
    name: 工期响应
    type: duration
    weight: 8
    tiers:
      - { max_days: 90, score: 8, reason: 工期满足要求（≤90 日历天） }
      - { max_days: 108, score: 5, reason: 工期超出要求在 20% 以内 }
      - { max_days: 9999, score: 0, reason: 工期超出要求 20% 以上 }
    basis: 招标文件：计划工期 90 日历天（实质性要求）
    basis_status: pending

  # ---------------------------------------------------------------- 商务（20）
  - id: B1
    category: 商务
    name: 类似项目业绩
    type: presence
    weight: 8
    patterns: ["业绩", "类似项目", "合同业绩", "同类项目"]
    tiers:
      - { state: provided, score: 8, reason: 提供了类似项目业绩材料 }
      - { state: missing, score: 0, reason: 未见类似项目业绩 }
    basis: 招标文件评分办法：类似业绩
    basis_status: pending

  - id: B2
    category: 商务
    name: 项目团队配置
    type: presence
    weight: 6
    patterns: ["项目负责人", "项目经理", "项目团队", "技术负责人"]
    tiers:
      - { state: provided, score: 6, reason: 明确了项目负责人/团队配置 }
      - { state: missing, score: 0, reason: 未明确项目负责人或团队配置 }
    basis: 招标文件评分办法：项目团队
    basis_status: pending

  - id: B3
    category: 商务
    name: 售后服务承诺
    type: presence
    weight: 6
    patterns: ["售后服务", "运维服务", "质保期", "服务响应"]
    tiers:
      - { state: provided, score: 6, reason: 提供了售后服务/质保承诺 }
      - { state: missing, score: 0, reason: 未见售后服务承诺 }
    basis: 招标文件评分办法：售后服务
    basis_status: pending
