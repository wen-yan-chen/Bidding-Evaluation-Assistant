# 评分细则 A：综合评分法（价格 40 / 技术 40 / 商务 20）
#
# 设计原则（手册 §1.3 第 2 条）：细则用 YAML，一项一档；换项目=换 YAML，不改代码。
# 算分全部是确定性规则（价格比值、工期天数、条款存在性），模型只负责把"扣分理由"写成自然语言。
#
# 字段说明：
#   type: price_ratio（报价/最高限价比值分档）| duration（工期响应）| presence（关键章节是否提供）
#   tiers: 按顺序匹配，命中第一档即得分（避免"多档同时满足"的歧义）
#   basis: 依据（招标文件评分办法条目；pending 时运行期输出「未检索到权威依据」）

id: profile-a
name: 综合评分法（价格 40 / 技术 40 / 商务 20）
version: "2026-11-15"
total: 100
scoring_method: 综合评分法

requirements:
  max_price: 2000000
  duration_days: 90
  price_unit: 元

items:
  # ---------------------------------------------------------------- 价格（40）
  - id: P1
    category: 价格
    name: 投标报价
    type: price_ratio
    weight: 40
    tiers:
      - { max_ratio: 0.90, score: 40, reason: 报价低于最高限价的 90%，价格竞争力强 }
      - { max_ratio: 0.97, score: 36, reason: 报价处于合理区间（90%–97%） }
      - { max_ratio: 1.00, score: 28, reason: 报价贴近最高限价（97%–100%） }
      - { max_ratio: 99.00, score: 0, reason: 报价超过最高限价，按废标处理 }
    basis: 招标文件评分办法：报价得分 = 按报价与最高限价比值分档
    basis_status: pending

  # ---------------------------------------------------------------- 技术（40）
  - id: T1
    category: 技术
    name: 技术方案完整性
    type: presence
    weight: 10
    patterns: ["技术方案", "技术路线"]
    tiers:
      - { state: provided, score: 10, reason: 提供了技术方案/技术路线章节 }
      - { state: missing, score: 0, reason: 未见技术方案章节，需澄清或扣分 }
    basis: 招标文件评分办法：技术方案完整性
    basis_status: pending

  - id: T2
    category: 技术
    name: 实施方案与进度计划
    type: presence
    weight: 10
    patterns: ["实施方案", "实施计划", "进度计划"]
    tiers:
      - { state: provided, score: 10, reason: 提供了实施方案/进度计划 }
      - { state: missing, score: 0, reason: 未见实施方案或进度计划，需澄清或扣分 }
    basis: 招标文件评分办法：实施方案与进度计划
    basis_status: pending

  - id: T3
    category: 技术
    name: 质量保证措施
    type: presence
    weight: 8
    patterns: ["质量保证", "质量管理", "质量控制"]
    tiers:
      - { state: provided, score: 8, reason: 提供了质量保证措施 }
      - { state: missing, score: 0, reason: 未见质量保证措施，需澄清或扣分 }
    basis: 招标文件评分办法：质量保证措施
    basis_status: pending

  - id: T4
    category: 技术
    name: 应急与安全保障
    type: presence
    weight: 6
    patterns: ["应急预案", "安全保障", "安全措施", "应急保障"]
    tiers:
      - { state: provided, score: 6, reason: 提供了应急/安全保障措施 }
      - { state: missing, score: 0, reason: 未见应急或安全保障措施，需澄清或扣分 }
    basis: 招标文件评分办法：应急与安全保障
    basis_status: pending

  - id: T5
    category: 技术
    name: 工期响应
    type: duration
    weight: 6
    tiers:
      - { max_days: 90, score: 6, reason: 工期满足招标文件要求（≤90 日历天） }
      - { max_days: 108, score: 4, reason: 工期超出要求但在 20% 以内，需说明理由 }
      - { max_days: 9999, score: 0, reason: 工期超出要求 20% 以上，实质性偏离 }
    basis: 招标文件：计划工期 90 日历天（实质性要求）
    basis_status: pending

  # ---------------------------------------------------------------- 商务（20）
  - id: B1
    category: 商务
    name: 类似项目业绩
    type: presence
    weight: 8
    patterns: ["业绩", "类似项目", "合同业绩", "同类项目"]
    tiers:
      - { state: provided, score: 8, reason: 提供了类似项目业绩材料 }
      - { state: missing, score: 0, reason: 未见类似项目业绩，需补充 }
    basis: 招标文件评分办法：类似业绩
    basis_status: pending

  - id: B2
    category: 商务
    name: 项目团队配置
    type: presence
    weight: 6
    patterns: ["项目负责人", "项目经理", "项目团队", "技术负责人"]
    tiers:
      - { state: provided, score: 6, reason: 明确了项目负责人/团队配置 }
      - { state: missing, score: 0, reason: 未明确项目负责人或团队配置，需补充 }
    basis: 招标文件评分办法：项目团队
    basis_status: pending

  - id: B3
    category: 商务
    name: 售后服务承诺
    type: presence
    weight: 6
    patterns: ["售后服务", "运维服务", "质保期", "服务响应"]
    tiers:
      - { state: provided, score: 6, reason: 提供了售后服务/质保承诺 }
      - { state: missing, score: 0, reason: 未见售后服务承诺，需补充 }
    basis: 招标文件评分办法：售后服务
    basis_status: pending
