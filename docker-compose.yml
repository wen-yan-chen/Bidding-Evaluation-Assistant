# 招投标评审助手 · 一键起服务
# 用法：docker compose up -d --build   →   http://localhost:8080
# 说明：Compose 会把目录名当作项目名，这里显式指定，避免中文目录名导致项目名非法
name: bid-review

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
    image: bid-review:${APP_TAG:-0.3.0}
    container_name: bid-review
    ports:
      # 宿主端口可覆盖：HOST_PORT=18080 docker compose up -d
      - "${HOST_PORT:-8080}:8000"
    environment:
      APP_ENV: ${APP_ENV:-docker}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      # D4 起 MCP 与 API 同栈：容器内用服务名互访
      MCP_URL: ${MCP_URL:-http://mcp:8765/sse}
      NEXENT_BASE: ${NEXENT_BASE:-}
      TZ: Asia/Shanghai
    volumes:
      # 上传件与评审结果持久化到宿主机，容器重建不丢
      - ./data:/app/data
    extra_hosts:
      # 容器内访问宿主机上的 Nexent
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # MCP 工具服务（D4 起）：把解析/扫描/溯源能力暴露给 Nexent 智能体调用
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
    image: bid-review:${APP_TAG:-0.3.0}
    container_name: bid-review-mcp
    command: ["python", "-m", "mcps.bid_review_mcp"]
    ports:
      # 平台侧登记 mcp_url 时用宿主可达地址；同栈内用 http://mcp:8765/sse
      - "${MCP_PORT:-8765}:8765"
    environment:
      MCP_PORT: "8765"
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Shanghai
    volumes:
      # 与 app 共用同一份解析结果（MCP 工具按 doc_id 读取）
      - ./data:/app/data
    # Dockerfile 里的 /health 探针在这里不适用（MCP 只开 8765），换成 TCP 探活
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8765), 3); s.close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
